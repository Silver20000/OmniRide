<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#121b2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.45" stop-color="#39ff88"/>
      <stop offset="0.8" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4357"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#glow)"/>

  <!-- Title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="150" font-size="96" font-weight="800" fill="#ffffff">Omni<tspan fill="#00e5ff">Ride</tspan></text>
    <text x="74" y="198" font-size="24" fill="#c9d1e0">Telemetria, cruscotto wireless e SOS per la tua moto</text>
    <text x="74" y="236" font-size="19" fill="#7f8aa3">Centralina sottosella + display touch a manubrio + app</text>

    <g font-size="17" font-weight="700" fill="#0a0e16" text-anchor="middle">
      <rect x="74" y="268" width="96" height="34" rx="17" fill="#00e5ff"/><text x="122" y="291">PIEGA</text>
      <rect x="180" y="268" width="104" height="34" rx="17" fill="#39ff88"/><text x="232" y="291">FORZE G</text>
      <rect x="294" y="268" width="138" height="34" rx="17" fill="#ffb300"/><text x="363" y="291">NAVIGATORE</text>
      <rect x="74" y="312" width="104" height="34" rx="17" fill="#8c7bff"/><text x="126" y="335">VIAGGIO</text>
      <rect x="188" y="312" width="122" height="34" rx="17" fill="#ff8a3d"/><text x="249" y="335">0-100 KM/H</text>
      <rect x="320" y="312" width="78" height="34" rx="17" fill="#ff3b3b"/><text x="359" y="335" fill="#ffffff">SOS</text>
    </g>
    <text x="74" y="388" font-size="16" fill="#7f8aa3">Senza fili · senza abbonamenti · aggiornamenti via Bluetooth</text>
  </g>

  <!-- Rectangular display (Viaggio page) -->
  <g transform="translate(652 92)">
    <rect x="0" y="0" width="190" height="226" rx="34" fill="url(#bezel)"/>
    <rect x="9" y="9" width="172" height="208" rx="27" fill="#05070b"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="24" y="34" font-size="11" font-weight="700" fill="#39ff88">LIVE 50Hz</text>
      <text x="166" y="34" font-size="11" font-weight="700" fill="#8a93a6" text-anchor="end">VIAGGIO</text>
      <line x1="20" y1="42" x2="170" y2="42" stroke="#1f2633"/>
      <rect x="17" y="48" width="156" height="58" rx="9" fill="#121822"/>
      <text x="86" y="95" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">87</text>
      <text x="116" y="95" font-size="12" font-weight="700" fill="#8a93a6">km/h</text>
      <rect x="17" y="112" width="75" height="44" rx="8" fill="#121822"/>
      <rect x="98" y="112" width="75" height="44" rx="8" fill="#121822"/>
      <text x="54" y="125" font-size="8" fill="#8a93a6" text-anchor="middle">VIAGGIO</text>
      <text x="54" y="147" font-size="14" font-weight="800" fill="#00e5ff" text-anchor="middle">142.3 km</text>
      <text x="135" y="125" font-size="8" fill="#8a93a6" text-anchor="middle">IN SELLA</text>
      <text x="135" y="147" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">2:14</text>
      <rect x="17" y="162" width="75" height="44" rx="8" fill="#121822"/>
      <rect x="98" y="162" width="75" height="44" rx="8" fill="#121822"/>
      <text x="54" y="175" font-size="8" fill="#8a93a6" text-anchor="middle">MEDIA</text>
      <text x="54" y="197" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">64 km/h</text>
      <text x="135" y="175" font-size="8" fill="#8a93a6" text-anchor="middle">AUTONOMIA</text>
      <text x="135" y="197" font-size="14" font-weight="800" fill="#ffb300" text-anchor="middle">58 km</text>
    </g>
  </g>

  <!-- Round display (Lean page): arc -60..+60 deg, lit 0..48 deg to the right -->
  <g transform="translate(1004 214)">
    <circle r="150" fill="url(#bezel)"/>
    <circle r="138" fill="#05070b"/>
    <circle r="134" fill="none" stroke="#0b3a6e" stroke-width="3"/>
    <path d="M -95.3 -55 A 110 110 0 0 1 95.3 -55" fill="none" stroke="#1a2232" stroke-width="18" stroke-linecap="round"/>
    <path d="M 0 -110 A 110 110 0 0 1 81.7 -73.6" fill="none" stroke="url(#lean)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 0 -122 L -6 -132 L 6 -132 Z" fill="#ffffff"/>
    <polygon points="93.3,-75.5 98.1,-88.3 106.8,-77.6" fill="#ffb300"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="0" y="12" font-size="72" font-weight="800" fill="#ffffff">48°</text>
      <text x="0" y="40" font-size="15" letter-spacing="4" fill="#8a93a6">PIEGA DX</text>
      <text x="-44" y="82" font-size="12" fill="#8a93a6">MAX SX</text>
      <text x="-44" y="100" font-size="17" font-weight="800" fill="#00e5ff">43°</text>
      <text x="44" y="82" font-size="12" fill="#8a93a6">MAX DX</text>
      <text x="44" y="100" font-size="17" font-weight="800" fill="#ffb300">51°</text>
    </g>
  </g>
</svg>
